<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 8 12" fill="#B8C8DC">
  <!-- Index finger (cols 2-3, rows 0-4) -->
  <rect x="2" y="0" width="2" height="5"/>
  <!-- Hand widening -->
  <rect x="1" y="5" width="4" height="1"/>
  <rect x="1" y="6" width="5" height="1"/>
  <!-- Full palm -->
  <rect x="0" y="7" width="7" height="3"/>
  <!-- Lower palm -->
  <rect x="1" y="10" width="6" height="1"/>
  <rect x="2" y="11" width="4" height="1"/>
</svg>
